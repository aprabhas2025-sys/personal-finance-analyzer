<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finora — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>
<button type="button" id="back" class="back">← Back to Finora</button>
<main class="stage">
  <header class="hero">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to return to your financial workspace.</p>
    <p class="by">Finora<sup>®</sup></p>
  </header>

  <form id="form" class="card" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-err">
      <p class="err" id="email-err" role="alert"></p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" maxlength="128" aria-describedby="pw-err">
        <button type="button" id="toggle" class="eye" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
            <path class="slash" d="M4 4l16 16"/>
          </svg>
        </button>
      </div>
      <p class="err" id="pw-err" role="alert"></p>
    </div>

    <p class="err server-err" id="server-err" role="alert" aria-live="polite"></p>
    <button type="submit" id="submit" class="btn"><span class="lbl">Sign in</span><span class="spin" aria-hidden="true"></span></button>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
